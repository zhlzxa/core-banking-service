version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The service targets the Java 21 LTS release. Base images receive patch
    # and minor updates; a move to the next LTS is a deliberate change made
    # together with java.version in pom.xml, never an automated bump.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
