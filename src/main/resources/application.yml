spring:
  application:
    name: core-banking-service
  # Connection settings are supplied by the environment. There is
  # deliberately no default password: a misconfigured deployment must fail
  # at startup rather than connect with a guessed credential.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/migration
  # The outbox publisher waits for acknowledgement from all in-sync replicas,
  # and the idempotent producer prevents duplicates caused by producer retries.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
  jpa:
    # The schema is owned by Flyway; Hibernate only verifies that the mappings match it.
    hibernate:
      ddl-auto: validate
    # Never keep a persistence context open while rendering the response: lazy loading
    # outside a transaction hides N+1 queries and holds connections longer than needed.
    open-in-view: false
  jackson:
    deserialization:
      # JSON numbers are read into BigDecimal exactly, never through a binary double.
      use-big-decimal-for-floats: true

server:
  port: ${SERVER_PORT:8080}
  # Never leak stack traces or exception messages to API clients.
  error:
    include-message: never
    include-stacktrace: never

logging:
  pattern:
    # Every log line carries the correlation id of the request that produced it.
    correlation: "[%X{correlationId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info

# The API is an OAuth2 resource server. Tokens are issued by an external
# OpenID Connect provider; the service never handles passwords.
corebanking:
  security:
    oidc:
      issuer: ${OIDC_ISSUER_URI}
      audience: ${OIDC_AUDIENCE}
  # Daily transfer limits reset at midnight in the bank's home time zone.
  business-day:
    zone: Asia/Hong_Kong
  # Teller withdrawals of this amount or more need a second teller's approval.
  cash:
    approval-threshold: 50000
    approval-validity: 30m
    # The most a terminal may pay out in a single withdrawal.
    atm-withdrawal-limit: 20000
  # Payments to other banks through FPS. A timeout never refunds the customer;
  # reconciliation asks FPS for the outcome with increasing back-off and
  # escalates to people after max-attempts.
  fps:
    client: simulated
    submission-grace: 1m
    retry-backoff: 30s, 1m, 2m, 5m, 15m, 30m
    max-attempts: 20
    reconciliation-lease: 2m
    reconciliation-batch-size: 50
    reconciliation:
      enabled: true
      interval: 30s
  # Integration events are written to the outbox in the business transaction
  # and published to Kafka afterwards, at least once.
  outbox:
    topic: corebanking.transactions.v1
    batch-size: 100
    lease: 30s
    retry-backoff: 1s, 5s, 30s, 2m, 10m
    send-timeout: 5s
    retention: 7d
    cleanup-batch-size: 10000
    publisher:
      enabled: true
      interval: 1s
    cleanup:
      interval: 1h
  notifications:
    enabled: true
