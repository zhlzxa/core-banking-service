spring:
  application:
    name: core-banking-service
  # Connection settings are supplied by the environment. There is
  # deliberately no default password: a misconfigured deployment must fail
  # at startup rather than connect with a guessed credential.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Never leak stack traces or exception messages to API clients.
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
